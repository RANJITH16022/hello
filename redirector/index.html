<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>redirector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            background: #000;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Top-right control bar */
        .bar {
            position: fixed;
            top: 14px;
            right: 14px;
            display: flex;
            gap: 8px;
            align-items: center;
            z-index: 10;
        }

        #codeInput {
            background: #000;
            border: 1px solid #00ff41;
            color: #00ff41;
            font-family: inherit;
            font-size: 13px;
            padding: 6px 10px;
            width: 160px;
            outline: none;
            caret-color: #00ff41;
        }

        #codeInput::placeholder {
            color: #00ff41;
            opacity: 0.5;
        }

        #codeInput:focus {
            box-shadow: 0 0 8px #00ff41;
        }

        #goButton {
            background: #000;
            border: 1px solid #00ff41;
            color: #00ff41;
            font-family: inherit;
            font-size: 13px;
            font-weight: bold;
            padding: 6px 14px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.15s;
        }

        #goButton:hover {
            background: #00ff41;
            color: #000;
        }

        #goButton:active {
            transform: scale(0.96);
        }

        /* Status line */
        #status {
            position: fixed;
            top: 52px;
            right: 14px;
            font-size: 12px;
            color: #00ff41;
            opacity: 0.8;
            z-index: 10;
        }

        #status.error {
            color: #ff2e2e;
        }

        /* Blinking cursor on the page */
        .cursor {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 14px;
        }
        .cursor::after {
            content: '_';
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Scanline effect */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 255, 65, 0.03) 0px,
                rgba(0, 255, 65, 0.03) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="bar">
        <input
            type="text"
            id="codeInput"
            placeholder="enter the code"
            autocomplete="off"
            spellcheck="false"
        >
        <button id="goButton">GO</button>
    </div>
    <div id="status"></div>
    <div class="cursor">root@redirector:~$</div>

    <script>
        // ===== CONFIG =====
        const SHEET_ID = '1B7kBBPYRXXfS2vWUNztGN6tOiCnOaPWYlRgrQQ5S5q4';
        const SHEET_NAME = 'Sheet1';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;
        // ==================

        const codeToLink = {};
        let loading = true;

        const inputEl = document.getElementById('codeInput');
        const statusEl = document.getElementById('status');

        function setStatus(msg, isError = false) {
            statusEl.textContent = msg;
            statusEl.classList.toggle('error', isError);
        }

        async function fetchSheetData() {
            try {
                setStatus('loading...');
                const res = await fetch(SHEET_URL);
                const text = await res.text();

                // Strip the google.visualization.Query.setResponse(...) wrapper
                const start = text.indexOf('{');
                const end = text.lastIndexOf('}') + 1;
                const data = JSON.parse(text.substring(start, end));

                data.table.rows.forEach(row => {
                    if (!row.c) return;
                    const code = row.c[0] && row.c[0].v != null ? String(row.c[0].v).trim() : '';
                    const link = row.c[1] && row.c[1].v != null ? String(row.c[1].v).trim() : '';
                    if (code && link && code.toLowerCase() !== 'code') {
                        codeToLink[code] = link;
                    }
                });

                loading = false;
                setStatus(`ready (${Object.keys(codeToLink).length} codes)`);
                checkUrlParam();
            } catch (err) {
                loading = false;
                console.error(err);
                setStatus('error loading data', true);
            }
        }

        function performRedirect() {
            const code = inputEl.value.trim();
            if (!code) { setStatus('enter a code', true); return; }
            if (loading) { setStatus('still loading...', true); return; }

            const link = codeToLink[code];
            if (!link) {
                setStatus('invalid code', true);
                inputEl.select();
                return;
            }
            setStatus('redirecting...');
            let url = link;
            if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
            window.location.href = url;
        }

        function checkUrlParam() {
            const params = new URLSearchParams(window.location.search);
            let code = params.get('code');

            // Support /redirector/code=1234 path style
            if (!code) {
                const m = window.location.pathname.match(/code=([^\/]+)/);
                if (m) code = decodeURIComponent(m[1]);
            }

            if (code) {
                inputEl.value = code;
                if (!loading) performRedirect();
            }
        }

        document.getElementById('goButton').addEventListener('click', performRedirect);
        inputEl.addEventListener('keydown', e => {
            if (e.key === 'Enter') performRedirect();
        });
        inputEl.addEventListener('input', () => {
            if (statusEl.classList.contains('error')) setStatus('');
        });

        fetchSheetData();
    </script>
</body>
</html>
