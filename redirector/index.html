<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
        }
        
        .container {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        #codeInput {
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 6px;
            width: 200px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        #codeInput:focus {
            border-color: #4CAF50;
        }
        
        #goButton {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: bold;
        }
        
        #goButton:hover {
            background-color: #45a049;
        }
        
        #goButton:active {
            transform: scale(0.98);
        }
        
        #errorMessage {
            position: absolute;
            top: 80px;
            right: 20px;
            color: #d32f2f;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <input 
            type="text" 
            id="codeInput" 
            placeholder="Enter code" 
            autocomplete="off"
        >
        <button id="goButton">Go</button>
    </div>
    <div id="errorMessage"></div>

    <script>
        // CONFIGURATION - Replace with your Google Sheet details
        const SHEET_ID = '1B7kBBPYRXXfS2vWUNztGN6tOiCnOaPWYlRgrQQ5S5q4'; // Replace with your actual sheet ID
        const SHEET_NAME = 'Sheet1'; // Replace with your sheet name if different
        
        // Google Sheets API endpoint (using the gviz/tq API which works with public sheets)
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;
        
        let codeToLinkMap = {};
        let isLoading = true;
        
        // Fetch the Google Sheet data
        async function fetchSheetData() {
            try {
                const response = await fetch(SHEET_URL);
                const text = await response.text();
                
                // Parse the JSONP-like response
                const jsonStart = text.indexOf('{');
                const jsonEnd = text.lastIndexOf('}') + 1;
                const jsonText = text.substring(jsonStart, jsonEnd);
                const data = JSON.parse(jsonText);
                
                // Build the code->link map
                const rows = data.table.rows;
                rows.forEach(row => {
                    if (row.c && row.c[0] && row.c[1]) {
                        const code = row.c[0].v ? row.c[0].v.toString().trim() : '';
                        const link = row.c[1].v ? row.c[1].v.toString().trim() : '';
                        if (code && link) {
                            codeToLinkMap[code] = link;
                        }
                    }
                });
                
                isLoading = false;
                console.log('Loaded codes:', Object.keys(codeToLinkMap));
                
                // Check for URL parameter after loading
                checkUrlParameter();
            } catch (error) {
                console.error('Error fetching sheet data:', error);
                isLoading = false;
                showError('Failed to load redirect data. Please try again later.');
            }
        }
        
        // Show error message
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            setTimeout(() => {
                errorEl.style.display = 'none';
            }, 3000);
        }
        
        // Perform redirect
        function performRedirect() {
            const input = document.getElementById('codeInput');
            const code = input.value.trim();
            
            if (!code) {
                showError('Please enter a code');
                return;
            }
            
            if (isLoading) {
                showError('Loading data, please wait...');
                return;
            }
            
            const link = codeToLinkMap[code];
            
            if (link) {
                // Ensure the link has a protocol
                let redirectUrl = link;
                if (!/^https?:\/\//i.test(redirectUrl)) {
                    redirectUrl = 'https://' + redirectUrl;
                }
                window.location.href = redirectUrl;
            } else {
                showError('Invalid code. Please check and try again.');
                input.select();
            }
        }
        
        // Check for URL parameter (e.g., ?code=1234 or /code=1234)
        function checkUrlParameter() {
            // Check query string first (?code=1234)
            const urlParams = new URLSearchParams(window.location.search);
            let code = urlParams.get('code');
            
            // If not in query string, check path (/redirector/code=1234)
            if (!code) {
                const pathMatch = window.location.pathname.match(/code=([^\/]+)/);
                if (pathMatch) {
                    code = decodeURIComponent(pathMatch[1]);
                }
            }
            
            if (code) {
                document.getElementById('codeInput').value = code;
                // Auto-redirect if data is loaded
                if (!isLoading) {
                    performRedirect();
                }
                // If still loading, the fetchSheetData will call checkUrlParameter again
            }
        }
        
        // Event listeners
        document.getElementById('goButton').addEventListener('click', performRedirect);
        
        document.getElementById('codeInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performRedirect();
            }
        });
        
        // Clear error on input
        document.getElementById('codeInput').addEventListener('input', function() {
            document.getElementById('errorMessage').style.display = 'none';
        });
        
        // Initialize
        fetchSheetData();
    </script>
</body>
</html>
