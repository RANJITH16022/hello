<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>redirector</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background: #0c0c0c;
            color: #cccccc;
            font-family: 'Cascadia Mono', 'Consolas', 'Courier New', monospace;
            font-size: 15px;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Prompt line at top-left */
        .bar {
            position: fixed;
            top: 16px;
            left: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
            white-space: nowrap;
        }

        #typed {
            color: #ffffff;
            white-space: pre;
        }

        /* Blinking block caret */
        .caret {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: #cccccc;
            animation: blink 1.06s steps(1) infinite;
        }

        @keyframes blink {
            0%, 50%    { opacity: 1; }
            50.01%,100%{ opacity: 0; }
        }

        /* Hidden input just for mobile keyboard */
        #hiddenInput {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            width: 1px;
            height: 1px;
            border: none;
            outline: none;
            background: transparent;
            color: transparent;
        }

        /* "go" — plain text, tap target for mobile */
        #goButton {
            color: #cccccc;
            cursor: pointer;
            padding: 2px 6px;
            opacity: 0.55;
            user-select: none;
        }
        #goButton:active { opacity: 1; }

        #status {
            position: fixed;
            top: 44px;
            left: 16px;
            font-size: 12px;
            color: #6a9955;
            z-index: 10;
        }
        #status.error { color: #f44747; }
    </style>
</head>
<body>

    <div class="bar">
        <span id="typed"></span><span class="caret"></span>
        <span id="goButton">go</span>
    </div>

    <div id="status"></div>
    <input id="hiddenInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" />

    <script>
        // ===== CONFIG =====
        const SHEET_ID   = '1B7kBBPYRXXfS2vWUNztGN6tOiCnOaPWYlRgrQQ5S5q4';
        const SHEET_NAME = 'Sheet1';
        const SHEET_URL  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;
        // ==================

        const codeToLink = {};
        let loading = true;
        let buffer  = '';

        const typedEl  = document.getElementById('typed');
        const inputEl  = document.getElementById('hiddenInput');
        const statusEl = document.getElementById('status');

        function setStatus(msg, isError = false) {
            statusEl.textContent = msg || '';
            statusEl.classList.toggle('error', !!isError);
        }
        function render() { typedEl.textContent = buffer; }
        function syncInput() { inputEl.value = buffer; }

        async function fetchSheetData() {
            try {
                setStatus('loading...');
                const res  = await fetch(SHEET_URL);
                const text = await res.text();
                const start = text.indexOf('{');
                const end   = text.lastIndexOf('}') + 1;
                const data  = JSON.parse(text.substring(start, end));

                data.table.rows.forEach(row => {
                    if (!row.c) return;
                    const code = row.c[0] && row.c[0].v != null ? String(row.c[0].v).trim() : '';
                    const link = row.c[1] && row.c[1].v != null ? String(row.c[1].v).trim() : '';
                    if (code && link && code.toLowerCase() !== 'code') codeToLink[code] = link;
                });

                loading = false;
                setStatus('');
                checkUrlParam();
            } catch (err) {
                loading = false;
                console.error(err);
                setStatus('error loading data', true);
            }
        }

        function performRedirect() {
            const code = buffer.trim();
            if (!code)     { setStatus('enter a code', true); return; }
            if (loading)   { setStatus('still loading...', true); return; }

            const link = codeToLink[code];
            if (!link) {
                setStatus('invalid code', true);
                buffer = ''; render(); syncInput();
                return;
            }
            setStatus('redirecting...');
            let url = link;
            if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
            window.location.href = url;
        }

        // Desktop keyboard
        document.addEventListener('keydown', e => {
            if (document.activeElement === inputEl && e.key !== 'Enter') return;

            if (e.key === 'Enter')     { e.preventDefault(); performRedirect(); return; }
            if (e.key === 'Backspace') { e.preventDefault(); buffer = buffer.slice(0, -1); render(); syncInput(); return; }
            if (e.key === 'Escape')    { buffer = ''; render(); syncInput(); return; }
            if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
                e.preventDefault();
                buffer += e.key; render(); syncInput();
            }
        });

        // Mobile keyboard
        inputEl.addEventListener('input', () => { buffer = inputEl.value; render(); });
        inputEl.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); performRedirect(); }
        });

        document.addEventListener('click', () => inputEl.focus({ preventScroll: true }));
        window.addEventListener('load', () => inputEl.focus({ preventScroll: true }));

        document.getElementById('goButton').addEventListener('click', e => {
            e.stopPropagation();
            performRedirect();
        });

        function checkUrlParam() {
            const params = new URLSearchParams(window.location.search);
            let code = params.get('code');
            if (!code) {
                const m = window.location.pathname.match(/code=([^\/]+)/);
                if (m) code = decodeURIComponent(m[1]);
            }
            if (code) {
                buffer = code; render(); syncInput();
                if (!loading) performRedirect();
            }
        }

        fetchSheetData();
    </script>
</body>
</html>
